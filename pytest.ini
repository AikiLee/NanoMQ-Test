[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    smoke: Quick smoke checks
    regression: Full regression checks
    e2e: End-to-end broker flow checks
    health: NanoMQ HTTP API health checks
    clients: MQTT clients and subscriptions observation checks
    publish: HTTP and MQTT publish checks
    contract: JSON schema contract checks
    negative: Auth and invalid request checks
    tls: Offline certificate and TLS checks
log_cli = true
log_cli_level = INFO
